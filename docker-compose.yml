services:
  deepscientist:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepscientist:latest
    container_name: deepscientist-app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount thư mục kết quả ra máy host để trực tiếp xem PDF và biểu đồ
      - ./output:/app/output
      # Mount tập dữ liệu tri thức (nếu có cập nhật hoặc bộ nhớ đệm)
      - ./data:/app/data
    # Mặc định chạy chủ đề tùy chọn (có thể ghi đè bằng tham số command)
    command: ["--topic", "Kolmogorov-Arnold Networks KAN for Scientific Machine Learning"]
